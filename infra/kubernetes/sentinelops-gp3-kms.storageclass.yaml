# Encrypted gp3 StorageClass for demo PVCs; the aws-ebs-csi-driver add-on serves it.
# Replace <environment-kms-key-arn> with the arn of aws_kms_key.main from the Terraform
# state (`terraform -chdir=infra/aws state show aws_kms_key.main`) before applying.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: sentinelops-gp3-kms
  labels: {app.kubernetes.io/part-of: sentinelops}
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  kmsKeyId: "<environment-kms-key-arn>"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
