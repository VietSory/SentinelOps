services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinelops
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - "5432:5432"
    volumes:
      - sentinelops_postgres:/var/lib/postgresql/data
      - ./infra/local/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelops"]
      interval: 3s
      timeout: 3s
      retries: 15

  payment-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    command: ["uvicorn", "services.payment.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SERVICE_NAME: payment-service
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinelops
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 3s
      timeout: 3s
      retries: 15

  inventory-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    command: ["uvicorn", "services.inventory.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SERVICE_NAME: inventory-service
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinelops
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 3s
      timeout: 3s
      retries: 15

  checkout-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    command: ["uvicorn", "services.checkout.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SERVICE_NAME: checkout-service
      PAYMENT_URL: http://payment-service:8000
      INVENTORY_URL: http://inventory-service:8000
      DOWNSTREAM_TIMEOUT_SECONDS: "4.0"
    ports:
      - "8001:8000"
    depends_on:
      payment-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  sentinelops_postgres:
