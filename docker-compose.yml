services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - sentinelops_prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 3s
      timeout: 3s
      retries: 15

  otel-collector:
    image: otel/opentelemetry-collector:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:13133:13133"
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    ports:
      - "127.0.0.1:16686:16686"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinelops
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sentinelops_postgres:/var/lib/postgresql/data
      - ./infra/local/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelops"]
      interval: 3s
      timeout: 3s
      retries: 15

  payment-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    command: ["uvicorn", "services.payment.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SERVICE_NAME: payment-service
      ENABLE_FAULT_INJECTION: "true"
      DEPLOYMENT_ENVIRONMENT: local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinelops
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 3s
      timeout: 3s
      retries: 15

  inventory-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    command: ["uvicorn", "services.inventory.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SERVICE_NAME: inventory-service
      ENABLE_FAULT_INJECTION: "true"
      DEPLOYMENT_ENVIRONMENT: local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinelops
    ports:
      - "127.0.0.1:8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 3s
      timeout: 3s
      retries: 15

  checkout-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    command: ["uvicorn", "services.checkout.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SERVICE_NAME: checkout-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PAYMENT_URL: http://payment-service:8000
      INVENTORY_URL: http://inventory-service:8000
      DOWNSTREAM_TIMEOUT_SECONDS: "4.0"
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      payment-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  sentinelops_postgres:
  sentinelops_prometheus:
