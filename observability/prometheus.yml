global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Operator worker monitoring. Each rule file is bind-mounted individually and
# read-only so the lane B deployment lock can hash it; do not switch this to a
# directory glob, which would silently accept unhashed files.
rule_files:
  - /etc/prometheus/rules/sentinelops-workers.yml

scrape_configs:
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: [otel-collector:8889]
