name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python scripts/validate_contracts.py
      - run: pytest -q
      - run: python scripts/check_installed_package.py

  public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[ml,dev]'
      - run: pytest -q tests/test_public_data*.py tests/test_gamma*.py tests/test_training_data_policy.py
      - name: Verify pinned publisher data and audit real Parquet tables
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import httpx
          from sentinelops.public_data.downloads import download_rcaeval
          from sentinelops.public_data.audit import audit_rcaeval
          catalog=json.loads(Path('configs/public_datasets.json').read_text())
          with httpx.Client(timeout=60,follow_redirects=True,trust_env=False) as client:
              selected=download_rcaeval(client,catalog['rcaeval'],Path('data/raw/public'))
          report=audit_rcaeval(Path(selected['manifest_path']))
          assert report['index_cases']==735 and len(report['downloaded_cases'])==3
          output=Path('artifacts/public-data/source-audit.json')
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_text(json.dumps(report,indent=2))
          print('PINNED PUBLIC DATA SOURCE AUDIT: PASS')
          PY
      - name: Verify complete pinned GAMMA archive member inventory with bounded ranges
        run: |
          python scripts/inventory_gamma_archive.py --file-lock configs/gamma_v1_archive_catalog.json --result-file artifacts/public-data/gamma-archive-catalog.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('artifacts/public-data/gamma-archive-catalog.json').read_text())
          assert report['lock']['entries']==129510 and report['processed_experiments']==190
          assert report['complete_request_type_experiments']==182
          assert report['response_body_bytes']<=32_000_000
          assert report['training_ready'] is False and report['activation_allowed'] is False
          print('COMPLETE GAMMA ZIP64 INVENTORY: PASS; MEMBER DATA ARE NOT ALL VERIFIED')
          PY
      - name: Acquire frozen GAMMA capability scope and audit real source tables
        run: |
          python scripts/download_gamma.py --file-lock configs/gamma_v1_phase_files.json --include-phase-evidence --result-file artifacts/public-data/gamma-acquisition.json
          python - <<'PY'
          import json
          from pathlib import Path
          from sentinelops.public_data.gamma_audit import audit_gamma
          from sentinelops.public_data.resources import build_resource_windows
          from sentinelops.public_data.phases import audit_phase_labels
          acquisition=json.loads(Path('artifacts/public-data/gamma-acquisition.json').read_text())
          report=audit_gamma(Path(acquisition['manifest_path']))
          assert report['verified_files']==142 and len(report['experiments'])==1
          assert report['activation_allowed'] is False
          assert not any(report['training_ready'].values())
          Path('artifacts/public-data/gamma-audit.json').write_text(json.dumps(report,indent=2))
          print('FROZEN GAMMA ACQUISITION/AUDIT: PASS; MODEL READINESS: NOT ESTABLISHED')
          first=build_resource_windows(Path(acquisition['manifest_path']),Path('configs/gamma_resource_profile.json'),
                                       Path('artifacts/public-data/resource-windows'),project=Path.cwd())
          second=build_resource_windows(Path(acquisition['manifest_path']),Path('configs/gamma_resource_profile.json'),
                                        Path('artifacts/public-data/resource-replay'),project=Path.cwd())
          assert first['rows']==580 and first['eligible_feature_rows']==437
          assert first['frame_sha256']==second['frame_sha256']
          assert first['feature_values_sha256']==second['feature_values_sha256']
          assert first['feature_values_sha256']=='e00da06523d3a4dbce22ca6ef4c9f9130818aff8b66232715b07095bbc064cc5'
          assert first['training_ready'] is False and first['activation_allowed'] is False
          print('REAL GAMMA RESOURCE REPLAY: PASS; MODEL/LABEL GATES REMAIN OPEN')
          labels=audit_phase_labels(Path(acquisition['manifest_path']),Path('artifacts/public-data/resource-windows'),
                                    Path('artifacts/public-data/interference-labels'),project=Path.cwd())
          assert labels['rows']==580 and len(labels['events']['cpu_aug12_25min_200_0'])==9
          assert labels['label_counts']=={'direct-recorded-interference':152,'no-recorded-interference-reference':29,'other-host-interference-context':399}
          assert labels['feature_eligible_label_counts']=={'direct-recorded-interference':92,'no-recorded-interference-reference':23,'other-host-interference-context':322}
          assert labels['training_ready'] is False and labels['activation_allowed'] is False
          print('NATIVE INTERFERENCE LABEL AUDIT: PASS; NOT A PRECURSOR/SLO TARGET')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-data-source-audit
          path: artifacts/public-data/
          retention-days: 7

  incident-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONTROL_DATABASE_URL: postgresql://control_writer:local-control-writer@127.0.0.1:5433/sentinelops_control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: docker compose -p sentinelops-control -f docker-compose.control.yml up -d --wait --wait-timeout 120
      - run: python scripts/check_incident_store.py
      - run: docker compose -p sentinelops-control -f docker-compose.control.yml restart control-postgres
      - run: docker compose -p sentinelops-control -f docker-compose.control.yml up -d --wait --wait-timeout 60
      - run: python scripts/check_incident_store.py --verify-report artifacts/incidents/store-acceptance.json
      - run: python scripts/check_incident_api.py --restart-database
      - name: Preserve incident storage evidence
        uses: actions/upload-artifact@v4
        with:
          name: incident-storage-evidence
          path: artifacts/incidents/
          retention-days: 7
      - name: Control database diagnostics
        if: failure()
        run: docker compose -p sentinelops-control -f docker-compose.control.yml logs --no-color --tail 100
      - name: Stop control testbed
        if: always()
        run: docker compose -p sentinelops-control -f docker-compose.control.yml down --volumes --remove-orphans

  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: python scripts/step2_smoke_test.py
      - run: python scripts/step3_smoke_test.py
      - run: python -m scripts.step4_smoke_test --output artifacts/step4/ci
      - name: Publish checksum-backed telemetry summary
        if: always()
        run: |
          if [ -f artifacts/step4/ci/smoke-report.json ]; then
            python -m scripts.summarize_telemetry_evidence artifacts/step4/ci/smoke-report.json
          else
            echo 'No successful Step 4 report was generated.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve telemetry capture evidence
        id: evidence_upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: step4-telemetry-evidence
          path: artifacts/step4/
          if-no-files-found: ignore
          retention-days: 7
      - name: Report unavailable artifact transport
        if: always() && steps.evidence_upload.outcome == 'failure'
        run: echo '::warning::GitHub artifact transport failed. Live verification results and checksums are in the job summary/logs; raw CI captures were not archived. Release evidence acceptance remains pending archival.'
      - name: Collect testbed diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200
      - name: Stop testbed
        if: always()
        run: docker compose down --volumes --remove-orphans
