name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python scripts/validate_contracts.py
      - run: pytest -q
      - run: python scripts/check_installed_package.py

  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: python scripts/step2_smoke_test.py
      - run: python scripts/step3_smoke_test.py
      - run: python -m scripts.step4_smoke_test --output artifacts/step4/ci
      - name: Preserve telemetry capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step4-telemetry-evidence
          path: artifacts/step4/
          if-no-files-found: ignore
          retention-days: 7
      - name: Collect testbed diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200
      - name: Stop testbed
        if: always()
        run: docker compose down --volumes --remove-orphans
