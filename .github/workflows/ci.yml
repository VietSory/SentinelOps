name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python scripts/validate_contracts.py
      - run: pytest -q
      - run: python scripts/check_installed_package.py

  public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[ml,dev]'
      - run: pytest -q tests/test_public_data*.py tests/test_gamma*.py tests/test_training_data_policy.py
      - name: Verify pinned publisher data and audit real Parquet tables
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import httpx
          from sentinelops.public_data.downloads import download_rcaeval
          from sentinelops.public_data.audit import audit_rcaeval
          catalog=json.loads(Path('configs/public_datasets.json').read_text())
          with httpx.Client(timeout=60,follow_redirects=True,trust_env=False) as client:
              selected=download_rcaeval(client,catalog['rcaeval'],Path('data/raw/public'))
          report=audit_rcaeval(Path(selected['manifest_path']))
          assert report['index_cases']==735 and len(report['downloaded_cases'])==3
          output=Path('artifacts/public-data/source-audit.json')
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_text(json.dumps(report,indent=2))
          print('PINNED PUBLIC DATA SOURCE AUDIT: PASS')
          PY
      - name: Acquire frozen GAMMA capability scope and audit real source tables
        run: |
          python scripts/download_gamma.py --file-lock configs/gamma_v1_audit_files.json --result-file artifacts/public-data/gamma-acquisition.json
          python - <<'PY'
          import json
          from pathlib import Path
          from sentinelops.public_data.gamma_audit import audit_gamma
          acquisition=json.loads(Path('artifacts/public-data/gamma-acquisition.json').read_text())
          report=audit_gamma(Path(acquisition['manifest_path']))
          assert report['verified_files']==139 and len(report['experiments'])==1
          assert report['activation_allowed'] is False
          assert not any(report['training_ready'].values())
          Path('artifacts/public-data/gamma-audit.json').write_text(json.dumps(report,indent=2))
          print('FROZEN GAMMA ACQUISITION/AUDIT: PASS; MODEL READINESS: NOT ESTABLISHED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-data-source-audit
          path: artifacts/public-data/
          retention-days: 7

  incident-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONTROL_DATABASE_URL: postgresql://control_writer:local-control-writer@127.0.0.1:5433/sentinelops_control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: docker compose -p sentinelops-control -f docker-compose.control.yml up -d --wait --wait-timeout 120
      - run: python scripts/check_incident_store.py
      - run: docker compose -p sentinelops-control -f docker-compose.control.yml restart control-postgres
      - run: docker compose -p sentinelops-control -f docker-compose.control.yml up -d --wait --wait-timeout 60
      - run: python scripts/check_incident_store.py --verify-report artifacts/incidents/store-acceptance.json
      - run: python scripts/check_incident_api.py --restart-database
      - name: Preserve incident storage evidence
        uses: actions/upload-artifact@v4
        with:
          name: incident-storage-evidence
          path: artifacts/incidents/
          retention-days: 7
      - name: Control database diagnostics
        if: failure()
        run: docker compose -p sentinelops-control -f docker-compose.control.yml logs --no-color --tail 100
      - name: Stop control testbed
        if: always()
        run: docker compose -p sentinelops-control -f docker-compose.control.yml down --volumes --remove-orphans

  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: python scripts/step2_smoke_test.py
      - run: python scripts/step3_smoke_test.py
      - run: python -m scripts.step4_smoke_test --output artifacts/step4/ci
      - name: Publish checksum-backed telemetry summary
        if: always()
        run: |
          if [ -f artifacts/step4/ci/smoke-report.json ]; then
            python -m scripts.summarize_telemetry_evidence artifacts/step4/ci/smoke-report.json
          else
            echo 'No successful Step 4 report was generated.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve telemetry capture evidence
        id: evidence_upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: step4-telemetry-evidence
          path: artifacts/step4/
          if-no-files-found: ignore
          retention-days: 7
      - name: Report unavailable artifact transport
        if: always() && steps.evidence_upload.outcome == 'failure'
        run: echo '::warning::GitHub artifact transport failed. Live verification results and checksums are in the job summary/logs; raw CI captures were not archived. Release evidence acceptance remains pending archival.'
      - name: Collect testbed diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200
      - name: Stop testbed
        if: always()
        run: docker compose down --volumes --remove-orphans
