name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python scripts/validate_contracts.py
      - run: pytest -q
      - run: python scripts/check_installed_package.py

  public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[ml,dev]'
      - run: pytest -q tests/test_public_data*.py tests/test_gamma*.py tests/test_training_data_policy.py tests/test_rcaeval_partitions.py
      - name: Verify pinned publisher data and audit real Parquet tables
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import httpx
          from sentinelops.public_data.downloads import download_rcaeval
          from sentinelops.public_data.audit import audit_rcaeval
          from sentinelops.public_data.rcaeval_partitions import audit_partitions
          catalog=json.loads(Path('configs/public_datasets.json').read_text())
          with httpx.Client(timeout=60,follow_redirects=True,trust_env=False) as client:
              selected=download_rcaeval(client,catalog['rcaeval'],Path('data/raw/public'))
          report=audit_rcaeval(Path(selected['manifest_path']))
          assert report['index_cases']==735 and len(report['downloaded_cases'])==3
          partitions=audit_partitions(Path(selected['manifest_path']),project=Path.cwd())
          assert partitions['cases']==735 and partitions['groups']==16 and partitions['holdout_opened'] is False
          assert partitions['case_telemetry_read'] is False and partitions['independent_sessions_established'] is False
          partition_output=Path('artifacts/public-data/rcaeval-partitions.json')
          partition_output.parent.mkdir(parents=True,exist_ok=True)
          partition_output.write_text(json.dumps(partitions,indent=2)+'\n')
          output=Path('artifacts/public-data/source-audit.json')
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_text(json.dumps(report,indent=2))
          print('PINNED PUBLIC DATA SOURCE AUDIT: PASS')
          PY
      - name: Verify complete pinned GAMMA archive member inventory with bounded ranges
        run: |
          python scripts/inventory_gamma_archive.py --file-lock configs/gamma_v1_archive_catalog.json --result-file artifacts/public-data/gamma-archive-catalog.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('artifacts/public-data/gamma-archive-catalog.json').read_text())
          assert report['lock']['entries']==129510 and report['processed_experiments']==190
          assert report['complete_request_type_experiments']==182
          assert report['response_body_bytes']<=32_000_000
          assert report['training_ready'] is False and report['activation_allowed'] is False
          print('COMPLETE GAMMA ZIP64 INVENTORY: PASS; MEMBER DATA ARE NOT ALL VERIFIED')
          PY
      - name: Acquire and verify the predeclared complete raw-resource cohort
        run: |
          python scripts/download_gamma_cohort.py --file-tree-lock configs/gamma_resource_cohort_files.json --result-file artifacts/public-data/gamma-cohort-acquisition.json
          python - <<'PY'
          import json
          from pathlib import Path
          from sentinelops.public_data.cohort import load_cohort_manifest
          result=json.loads(Path('artifacts/public-data/gamma-cohort-acquisition.json').read_text())
          scope=json.loads(Path('configs/gamma_resource_cohort_scope.json').read_text())
          lock=json.loads(Path('configs/gamma_resource_cohort_files.json').read_text())
          path=Path(result['manifest_path'])
          manifest,groups=load_cohort_manifest(path,scope,expected_tree=lock)
          assert len(groups)==195 and manifest['file_tree_lock']['files']==30364
          assert manifest['experiments']==194 and manifest['training_ready'] is False
          assert manifest['role_counts']=={'args':194,'placement':6484,'resource':23048,'phase':634,'global-metadata':4}
          records={row['source_path']:row for bundle in groups.values() for row in bundle['members']}
          previous=json.loads(Path('configs/gamma_v1_phase_files.json').read_text())['files']
          shared=set(previous)&set(records)
          assert len(shared)==128
          assert all((previous[name]['size'],previous[name]['sha256'])==(records[name]['size'],records[name]['sha256']) for name in shared)
          Path('artifacts/public-data/gamma-cohort-manifest.json').write_bytes(path.read_bytes())
          print('COMPLETE RAW COHORT CONTENT/FILE-TREE REPLAY: PASS; SEMANTIC/SPLIT/TRAINING GATES REMAIN OPEN')
          from sentinelops.public_data.admission import audit_cohort_admission
          admission=audit_cohort_admission(path,Path('configs/gamma_resource_cohort_scope.json'),
              Path('configs/gamma_resource_cohort_files.json'),Path('configs/gamma_admission_profile.json'),
              Path('configs/gamma_development_inspections.json'),Path('artifacts/public-data/native-admission'),project=Path.cwd())
          assert admission['case_count']==194 and sum(admission['status_counts'].values())==194
          assert admission['status_counts']=={'native-evidence-admitted':101,'quarantined':93}
          assert admission['group_count']==19 and admission['candidate_final_holdout_groups']==7
          assert admission['training_ready'] is False and admission['activation_allowed'] is False
          native=json.loads(Path(admission['report_path']).read_text())
          frozen_groups=json.loads(Path('configs/gamma_source_groups.json').read_text())
          assert native['groups']==frozen_groups['groups']
          assert native['profile_sha256']==frozen_groups['admission_profile_sha256']
          assert native['source_file_tree_sha256']==frozen_groups['source_file_tree_sha256']
          assert native['inspections_sha256']==frozen_groups['inspections_sha256']
          by_case={row['experiment']:row for row in native['cases']}
          assert by_case['cpu_aug12_25min_200_0']['status']=='native-evidence-admitted'
          assert by_case['mem_sep22_10min_800_0']['status']=='quarantined'
          assert by_case['net_oct4_10min_800_0']['status']=='quarantined'
          assert all(not group['final_holdout_eligible'] for group in native['groups'] if group['development_inspected'])
          Path('artifacts/public-data/native-admission-summary.json').write_text(json.dumps(admission,indent=2))
          print('REAL NATIVE EVIDENCE/GROUP ADMISSION: PASS; MODEL/SPLIT GATES REMAIN OPEN')
          from sentinelops.public_data.dataset import build_grouped_dataset
          from sentinelops.public_data.gamma import canonical_bytes
          import hashlib
          dataset=build_grouped_dataset(path,Path(admission['report_path']),Path('configs/gamma_resource_cohort_scope.json'),
              Path('configs/gamma_resource_cohort_files.json'),Path('configs/gamma_source_groups.json'),
              Path('configs/gamma_resource_splits.json'),Path('configs/gamma_resource_profile.json'),
              Path('artifacts/public-data/grouped-dataset'),project=Path.cwd())
          assert sum(dataset['case_counts'].values())==194
          assert dataset['training_ready'] is False and dataset['risk_target_available'] is False
          assert dataset['source_reference_is_healthy_certificate'] is False
          expected=json.loads(Path('docs/reports/evidence/2026-10-26-gamma-grouped-dataset.json').read_text())
          for key in ('rows','counts','case_counts','label_counts','feature_eligible_label_counts',
                      'feature_values_sha256','profile_sha256','split_sha256','source_file_tree_sha256'):
              assert dataset[key]==expected[key], key
          fields=('experiment','entity','window_start','window_end','max_input_observed_at','eligible_for_features','features','quality')
          capability=[]
          for line in Path('artifacts/public-data/grouped-dataset/resource-windows.jsonl').open():
              row=json.loads(line)
              if row['experiment']=='cpu_aug12_25min_200_0':
                  capability.append({key:row[key] for key in fields})
          legacy_identity={'feature_set_version':dataset['feature_set_version'],'profile_sha256':dataset['profile_sha256'],'windows':capability}
          assert len(capability)==580
          assert hashlib.sha256(canonical_bytes(legacy_identity)).hexdigest()=='e00da06523d3a4dbce22ca6ef4c9f9130818aff8b66232715b07095bbc064cc5'
          print('GROUP-FIRST DATASET/LEGACY FEATURE PARITY: PASS; MODEL/HEALTH/SLO READINESS NOT ESTABLISHED')
          PY
      - name: Acquire frozen GAMMA capability scope and audit real source tables
        run: |
          python scripts/download_gamma.py --file-lock configs/gamma_v1_phase_files.json --include-phase-evidence --result-file artifacts/public-data/gamma-acquisition.json
          python - <<'PY'
          import json
          from pathlib import Path
          from sentinelops.public_data.gamma_audit import audit_gamma
          from sentinelops.public_data.resources import build_resource_windows
          from sentinelops.public_data.phases import audit_phase_labels
          acquisition=json.loads(Path('artifacts/public-data/gamma-acquisition.json').read_text())
          report=audit_gamma(Path(acquisition['manifest_path']))
          assert report['verified_files']==142 and len(report['experiments'])==1
          assert report['activation_allowed'] is False
          assert not any(report['training_ready'].values())
          Path('artifacts/public-data/gamma-audit.json').write_text(json.dumps(report,indent=2))
          print('FROZEN GAMMA ACQUISITION/AUDIT: PASS; MODEL READINESS: NOT ESTABLISHED')
          first=build_resource_windows(Path(acquisition['manifest_path']),Path('configs/gamma_resource_profile.json'),
                                       Path('artifacts/public-data/resource-windows'),project=Path.cwd())
          second=build_resource_windows(Path(acquisition['manifest_path']),Path('configs/gamma_resource_profile.json'),
                                        Path('artifacts/public-data/resource-replay'),project=Path.cwd())
          assert first['rows']==580 and first['eligible_feature_rows']==437
          assert first['frame_sha256']==second['frame_sha256']
          assert first['feature_values_sha256']==second['feature_values_sha256']
          assert first['feature_values_sha256']=='e00da06523d3a4dbce22ca6ef4c9f9130818aff8b66232715b07095bbc064cc5'
          assert first['training_ready'] is False and first['activation_allowed'] is False
          print('REAL GAMMA RESOURCE REPLAY: PASS; MODEL/LABEL GATES REMAIN OPEN')
          labels=audit_phase_labels(Path(acquisition['manifest_path']),Path('artifacts/public-data/resource-windows'),
                                    Path('artifacts/public-data/interference-labels'),project=Path.cwd())
          assert labels['rows']==580 and len(labels['events']['cpu_aug12_25min_200_0'])==9
          assert labels['label_counts']=={'direct-recorded-interference':152,'no-recorded-interference-reference':29,'other-host-interference-context':399}
          assert labels['feature_eligible_label_counts']=={'direct-recorded-interference':92,'no-recorded-interference-reference':23,'other-host-interference-context':322}
          assert labels['training_ready'] is False and labels['activation_allowed'] is False
          print('NATIVE INTERFERENCE LABEL AUDIT: PASS; NOT A PRECURSOR/SLO TARGET')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-data-source-audit
          path: artifacts/public-data/
          retention-days: 7

  incident-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONTROL_DATABASE_URL: postgresql://control_writer:local-control-writer@127.0.0.1:5433/sentinelops_control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: docker compose -p sentinelops-control -f docker-compose.control.yml up -d --wait --wait-timeout 120
      - run: python scripts/check_incident_store.py
      - run: docker compose -p sentinelops-control -f docker-compose.control.yml restart control-postgres
      - run: docker compose -p sentinelops-control -f docker-compose.control.yml up -d --wait --wait-timeout 60
      - run: python scripts/check_incident_store.py --verify-report artifacts/incidents/store-acceptance.json
      - run: python scripts/check_incident_api.py --restart-database
      - name: Preserve incident storage evidence
        uses: actions/upload-artifact@v4
        with:
          name: incident-storage-evidence
          path: artifacts/incidents/
          retention-days: 7
      - name: Control database diagnostics
        if: failure()
        run: docker compose -p sentinelops-control -f docker-compose.control.yml logs --no-color --tail 100
      - name: Stop control testbed
        if: always()
        run: docker compose -p sentinelops-control -f docker-compose.control.yml down --volumes --remove-orphans

  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: python scripts/step2_smoke_test.py
      - run: python scripts/step3_smoke_test.py
      - run: python -m scripts.step4_smoke_test --output artifacts/step4/ci
      - name: Verify objective health signals from the real captured telemetry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from sentinelops.incidents.health_replay import replay_health_manifest
          from sentinelops.telemetry.store import ArtifactStore
          from sentinelops.contracts import utc_time
          source=ArtifactStore('artifacts/step4/ci')
          smoke=json.loads(Path('artifacts/step4/ci/smoke-report.json').read_text())
          for reference in smoke['evidence_refs']:
              utc_time(source.read(reference)['collected_at'])
          health=replay_health_manifest(source,smoke['evidence_manifest_ref'],
              json.loads(Path('configs/slo_health_policy.json').read_text()),Path('artifacts/step4/health'),project=Path.cwd())
          assert health['signal_count']==3*health['bucket_count']
          assert health['raw_normalization_parity'] is True
          assert health['event_counts'].get('payment-service/incident_opened',0)>=1
          assert health['historical_emission_times_verified'] is False
          assert health['model_outputs_available'] is False and health['actions_dispatched'] is False
          print('REAL CAPTURE OBJECTIVE SLO HEALTH REPLAY: PASS',health['event_counts'])
          import yaml
          from sentinelops.incidents.correlation_replay import replay_correlation
          correlated=replay_correlation(ArtifactStore('artifacts/step4/health'),health['report_ref'],
              yaml.safe_load(Path('configs/topology.yaml').read_text()),Path('artifacts/step4/correlation'),project=Path.cwd())
          result=correlated['correlation']
          assert any({'checkout-service','payment-service'}<=set(group['affected_services']) for group in result['groups'])
          assert result['actions_allowed'] is False and result['rca_evaluated'] is False
          print('REAL CAPTURE CONSERVATIVE EPISODE CORRELATION: PASS',len(result['groups']))
          from sentinelops.incidents.rca_replay import replay_rca
          rca=replay_rca(source,ArtifactStore('artifacts/step4/health'),ArtifactStore('artifacts/step4/correlation'),
              correlated['report_ref'],json.loads(Path('configs/rca_policy.json').read_text()),
              Path('artifacts/step4/rca'),project=Path.cwd())
          assert rca['group_count']==len(result['groups']) and rca['raw_health_correlation_lineage_verified']
          assert rca['model_outputs_available'] is False and rca['actions_allowed'] is False
          assert rca['historical_emissions_verified'] is False
          for row in rca['results']:
              assert row['rca']['abstained'] and row['rca']['actions_allowed'] is False
              for candidate in row['rca']['candidates']:
                  assert candidate['components']['recent_change_support']['value'] is None
                  if candidate['service']!='rds':
                      assert candidate['components']['anomaly_strength']['value'] is None
          print('REAL CAPTURE EVIDENCE RCA REPLAY: PASS',rca['group_count'])
          Path('artifacts/step4/rca-report-ref.txt').write_text(rca['report_ref'])
          PY
      - name: Start exclusive RCA control database
        run: docker compose -p sentinelops-rca-ci -f docker-compose.control.yml up -d --wait --wait-timeout 120
      - name: Verify computed RCA IER persistence and protected HTTP
        env:
          CONTROL_DATABASE_URL: postgresql://control_writer:local-control-writer@127.0.0.1:5433/sentinelops_control
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,sys
          container=subprocess.check_output(['docker','compose','-p','sentinelops-rca-ci','-f',
              'docker-compose.control.yml','ps','-q','control-postgres'],text=True).strip()
          subprocess.run([sys.executable,'scripts/check_rca_producer.py','--bundle','artifacts/step4/rca',
              '--report-ref',Path('artifacts/step4/rca-report-ref.txt').read_text().strip(),
              '--database-container',container,'--output','artifacts/step4/rca-producer/acceptance.json'],check=True)
          PY
      - name: Publish checksum-backed telemetry summary
        if: always()
        run: |
          if [ -f artifacts/step4/ci/smoke-report.json ]; then
            python -m scripts.summarize_telemetry_evidence artifacts/step4/ci/smoke-report.json
          else
            echo 'No successful Step 4 report was generated.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve telemetry capture evidence
        id: evidence_upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: step4-telemetry-evidence
          path: artifacts/step4/
          if-no-files-found: ignore
          retention-days: 7
      - name: Report unavailable artifact transport
        if: always() && steps.evidence_upload.outcome == 'failure'
        run: echo '::warning::GitHub artifact transport failed. Live verification results and checksums are in the job summary/logs; raw CI captures were not archived. Release evidence acceptance remains pending archival.'
      - name: Collect testbed diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200
      - name: Stop testbed
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Stop RCA control testbed
        if: always()
        run: docker compose -p sentinelops-rca-ci -f docker-compose.control.yml down --volumes --remove-orphans

  multi-fault-development:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: sentinelops-s5-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 120
      - name: Capture frozen S5 blocking-error development case
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,subprocess,sys
          protocol=json.loads(Path('configs/s5_development_protocol.json').read_text())
          case=next(c for c in protocol['cases'] if c['name']=='independent-blocking-errors')
          args=[sys.executable,'-m','scripts.run_experiment','--output','artifacts/s5/experiments',
              '--session-id','s5-ci-development']
          for key,value in case.items():
              if key!='name':args+=['--'+key.replace('_','-'),str(value)]
          env=dict(os.environ);env.pop('DATABASE_URL',None)
          log=Path('artifacts/s5/capture.log');log.parent.mkdir(parents=True,exist_ok=True)
          with log.open('w') as saved:
              process=subprocess.Popen(args,env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              for line in process.stdout:
                  saved.write(line);saved.flush();print(line,end='',flush=True)
              raise SystemExit(process.wait())
          PY
      - name: Verify independent roots and ambiguous shared consumer from raw evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.evaluate_s5 import evaluate
          runs=list(Path('artifacts/s5/experiments').glob('run-*/run.json'))
          assert len(runs)==1
          report=evaluate(runs[0].parent,Path('artifacts/s5/evaluation'),Path('configs/s5_development_protocol.json'))
          assert report['status']=='PASS' and report['heldout_opened'] is False
          assert report['full_G4_accepted'] is False and report['actions_allowed'] is False
          print('REAL S5 INDEPENDENT-ROOT DEVELOPMENT ACCEPTANCE: PASS')
          PY
      - name: Preserve S5 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s5-development-evidence
          path: artifacts/s5/
          if-no-files-found: warn
          retention-days: 7
      - name: S5 testbed diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop S5 testbed
        if: always()
        run: docker compose down --volumes --remove-orphans

  health-worker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: sentinelops-health-ci
      CONTROL_DATABASE_URL: postgresql://control_writer:local-control-writer@127.0.0.1:5433/sentinelops_control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Prepare an actual v1 database for explicit worker migration acceptance
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          source=yaml.safe_load(Path('docker-compose.control.yml').read_text())
          service=source['services']['control-postgres']
          service['volumes']=[str(Path(v.split(':')[0]).resolve())+':'+':'.join(v.split(':')[1:]) if v.startswith('./') else v
                              for v in service['volumes'] if '003-health-worker.sql' not in v]
          Path('/tmp/sentinelops-health-v1.yml').write_text(yaml.safe_dump(source,sort_keys=False))
          PY
          docker compose -p sentinelops-health-control-ci -f /tmp/sentinelops-health-v1.yml up -d --wait --wait-timeout 90
      - name: Verify explicit migration, atomic checkpoints, role, concurrency and database restart
        run: python -m scripts.check_health_worker_store --container sentinelops-health-control-ci-control-postgres-1 --project sentinelops-health-control-ci --output artifacts/workers/storage/acceptance.json
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 120
      - name: Verify the frozen native worker protocol through actual process and source outages
        run: |
          python - <<'PY'
          import os,subprocess,sys
          from pathlib import Path
          env=os.environ.copy();env.pop('DATABASE_URL',None)
          output=Path('artifacts/workers/native.log');output.parent.mkdir(parents=True,exist_ok=True)
          command=[sys.executable,'-m','scripts.check_health_worker_live',
                   '--control-container','sentinelops-health-control-ci-control-postgres-1',
                   '--control-project','sentinelops-health-control-ci','--native-project','sentinelops-health-ci',
                   '--prometheus-container','sentinelops-health-ci-prometheus-1','--output','artifacts/workers/live']
          with output.open('x') as stream:
              result=subprocess.run(command,env=env,stdout=stream,stderr=subprocess.STDOUT)
          raise SystemExit(result.returncode)
          PY
      - name: Revalidate the exported health ledger without a live database
        run: python -m scripts.replay_health_worker --run artifacts/workers/live --output artifacts/workers/offline-ledger-replay.json
      - name: Preserve continuous worker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-worker-evidence
          path: artifacts/workers/
          retention-days: 7
      - name: Worker testbed diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose -p sentinelops-health-control-ci -f /tmp/sentinelops-health-v1.yml ps
      - name: Stop worker native testbed
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Stop worker control testbed
        if: always()
        run: docker compose -p sentinelops-health-control-ci -f /tmp/sentinelops-health-v1.yml down --volumes --remove-orphans
